<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#ff6b2c" />
        <title>R&C Dine - Offline</title>
        <style>
            :root {
                color-scheme: light;
                font-family:
                    Inter,
                    ui-sans-serif,
                    system-ui,
                    -apple-system,
                    BlinkMacSystemFont,
                    'Segoe UI',
                    sans-serif;
                background: #fff8f4;
                color: #2e1711;
            }

            * {
                box-sizing: border-box;
            }

            body {
                min-height: 100vh;
                margin: 0;
                display: grid;
                place-items: center;
                padding: 24px;
            }

            main {
                width: min(100%, 420px);
                padding: 32px;
                border: 1px solid #ffe0d1;
                border-radius: 24px;
                background: #ffffff;
                box-shadow: 0 20px 50px rgba(72, 34, 23, 0.12);
                text-align: center;
            }

            img {
                width: 96px;
                height: 96px;
                border-radius: 22px;
            }

            h1 {
                margin: 18px 0 8px;
                font-size: 1.55rem;
            }

            p {
                margin: 0 0 22px;
                color: #67473f;
                line-height: 1.55;
            }

            button {
                border: 0;
                border-radius: 999px;
                padding: 12px 22px;
                background: #ff6b2c;
                color: #ffffff;
                font: inherit;
                font-weight: 700;
                cursor: pointer;
            }
        </style>
    </head>
    <body>
        <main>
            <img src="/icons/icon-192.png" alt="R&C Dine" />
            <h1>You’re offline</h1>
            <p>Check your internet connection, then try again. Previously opened screens may still be available.</p>
            <button type="button" onclick="window.location.reload()">Try again</button>
        </main>
    </body>
</html>
