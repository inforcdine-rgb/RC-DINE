<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />

        <link rel="icon" href="%PUBLIC_URL%/fevicon.ico" />

        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#ff6b2c" />

        <style>
            .rc-boot-loader {
                position: fixed;
                inset: 0;
                z-index: 99999;
                display: grid;
                place-items: center;
                min-height: 100vh;
                min-height: 100dvh;
                padding: 24px;
                color: #2f1e17;
                background:
                    radial-gradient(circle at 50% 38%, rgba(255, 122, 45, 0.18), transparent 29%),
                    linear-gradient(145deg, #fffdfb, #fff4ed);
                font-family:
                    Inter,
                    -apple-system,
                    BlinkMacSystemFont,
                    'Segoe UI',
                    sans-serif;
            }
            .rc-boot-card {
                display: grid;
                justify-items: center;
                width: min(300px, calc(100vw - 48px));
                padding: 34px 28px 30px;
                border: 1px solid rgba(255, 255, 255, 0.9);
                border-radius: 30px;
                background: rgba(255, 255, 255, 0.72);
                box-shadow: 0 24px 70px rgba(82, 43, 26, 0.14);
            }
            .rc-boot-mark {
                position: relative;
                display: grid;
                width: 112px;
                height: 112px;
                place-items: center;
            }
            .rc-boot-mark::before,
            .rc-boot-mark::after {
                position: absolute;
                inset: 4px;
                border: 1px solid rgba(246, 105, 38, 0.22);
                border-radius: 50%;
                content: '';
                animation: rcBootSpin 2.4s linear infinite;
            }
            .rc-boot-mark::after {
                inset: 16px;
                border-style: dashed;
                border-color: rgba(91, 48, 30, 0.17);
                animation-duration: 3.2s;
                animation-direction: reverse;
            }
            .rc-boot-logo {
                position: relative;
                z-index: 2;
                display: grid;
                width: 58px;
                height: 58px;
                place-items: center;
                border-radius: 19px;
                color: #fff;
                background: linear-gradient(145deg, #ff7a2d, #ef4f13);
                box-shadow: 0 12px 28px rgba(239, 79, 19, 0.28);
                font-family: Georgia, 'Times New Roman', serif;
                font-size: 32px;
                font-weight: 800;
                animation: rcBootBreathe 1.9s ease-in-out infinite;
            }
            .rc-boot-card strong {
                margin-top: 14px;
                font-size: 22px;
                letter-spacing: -0.035em;
            }
            .rc-boot-card small {
                margin-top: 5px;
                color: #765f54;
                font-size: 13px;
                font-weight: 650;
            }
            .rc-boot-progress {
                width: 150px;
                height: 5px;
                margin-top: 22px;
                overflow: hidden;
                border-radius: 999px;
                background: rgba(87, 55, 40, 0.09);
            }
            .rc-boot-progress span {
                display: block;
                width: 48%;
                height: 100%;
                border-radius: inherit;
                background: linear-gradient(90deg, #ff9b4a, #ff5b1a, #ff9b4a);
                animation: rcBootProgress 1.3s cubic-bezier(0.65, 0, 0.35, 1) infinite;
            }
            @keyframes rcBootSpin {
                to {
                    transform: rotate(360deg);
                }
            }
            @keyframes rcBootBreathe {
                50% {
                    transform: scale(1.06);
                }
            }
            @keyframes rcBootProgress {
                from {
                    transform: translateX(-115%);
                }
                to {
                    transform: translateX(235%);
                }
            }
            @media (prefers-reduced-motion: reduce) {
                .rc-boot-mark::before,
                .rc-boot-mark::after,
                .rc-boot-logo,
                .rc-boot-progress span {
                    animation-duration: 1ms !important;
                    animation-iteration-count: 1 !important;
                }
            }
        </style>

        <script>
            (function () {
                var RECOVERY_KEY = 'rcdineAutomaticCacheRecovery';
                var RECOVERY_WINDOW_MS = 2 * 60 * 1000;
                var recoveryStarted = false;

                var readPreviousAttempt = function () {
                    try {
                        return JSON.parse(window.sessionStorage.getItem(RECOVERY_KEY) || 'null');
                    } catch (_error) {
                        return null;
                    }
                };

                var showRecoveryHelp = function () {
                    var render = function () {
                        document.body.innerHTML =
                            '<main style="min-height:100vh;display:grid;place-items:center;padding:24px;background:#fff7f2;font-family:Arial,sans-serif;color:#241b17;text-align:center">' +
                            '<section><h1 style="margin:0 0 10px">RC Dine is reconnecting</h1>' +
                            '<p style="margin:0 0 18px;color:#6d5b52">Please check your internet connection and try again.</p>' +
                            '<button id="rcdine-retry" style="border:0;border-radius:12px;padding:12px 20px;background:#ff6b2c;color:white;font-weight:700">Try again</button></section></main>';
                        document.getElementById('rcdine-retry').addEventListener('click', function () {
                            window.sessionStorage.removeItem(RECOVERY_KEY);
                            window.location.reload();
                        });
                    };

                    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', render);
                    else render();
                };

                var repairCache = function (reason) {
                    if (recoveryStarted) return;
                    recoveryStarted = true;

                    var now = Date.now();
                    var previousAttempt = readPreviousAttempt();
                    if (previousAttempt && now - Number(previousAttempt.at || 0) < RECOVERY_WINDOW_MS) {
                        showRecoveryHelp();
                        return;
                    }

                    try {
                        window.sessionStorage.setItem(RECOVERY_KEY, JSON.stringify({ at: now, reason: reason }));
                    } catch (_error) {
                        // Recovery still works when session storage is unavailable.
                    }

                    var clearAppCaches =
                        'caches' in window
                            ? window.caches
                                  .keys()
                                  .then(function (keys) {
                                      return Promise.all(
                                          keys
                                              .filter(function (key) {
                                                  return key.indexOf('rcdine-') === 0;
                                              })
                                              .map(function (key) {
                                                  return window.caches.delete(key);
                                              })
                                      );
                                  })
                                  .catch(function () {})
                            : Promise.resolve();

                    var refreshWorkers =
                        'serviceWorker' in navigator
                            ? navigator.serviceWorker
                                  .getRegistrations()
                                  .then(function (registrations) {
                                      return Promise.allSettled(
                                          registrations.map(function (registration) {
                                              return registration.update();
                                          })
                                      );
                                  })
                                  .catch(function () {})
                            : Promise.resolve();

                    Promise.allSettled([clearAppCaches, refreshWorkers]).finally(function () {
                        var recoveryUrl = new URL(window.location.href);
                        recoveryUrl.searchParams.set('rcRecover', String(now));
                        window.location.replace(recoveryUrl.href);
                    });
                };

                window.addEventListener(
                    'error',
                    function (event) {
                        var target = event.target;
                        var assetUrl = target && (target.src || target.href);
                        if (!assetUrl || !target || !['SCRIPT', 'LINK'].includes(target.tagName)) return;

                        try {
                            var url = new URL(assetUrl, window.location.href);
                            if (url.origin === window.location.origin && url.pathname.indexOf('/static/') === 0) {
                                repairCache('static-asset-load-failed');
                            }
                        } catch (_error) {
                            // Ignore invalid third-party asset URLs.
                        }
                    },
                    true
                );

                window.addEventListener('unhandledrejection', function (event) {
                    var message = String((event.reason && event.reason.message) || event.reason || '');
                    if (
                        /ChunkLoadError|Loading chunk .* failed|dynamically imported module|module script failed/i.test(
                            message
                        )
                    ) {
                        repairCache('javascript-chunk-load-failed');
                    }
                });

                window.setTimeout(function () {
                    var root = document.getElementById('root');
                    var bootLoaderStillVisible = root && root.querySelector('.rc-boot-loader');
                    if (!root || root.childElementCount === 0 || bootLoaderStillVisible) {
                        repairCache('empty-application-root');
                    }
                }, 12000);

                window.setTimeout(function () {
                    var root = document.getElementById('root');
                    var applicationMounted =
                        root && root.childElementCount > 0 && !root.querySelector('.rc-boot-loader');
                    if (applicationMounted) {
                        try {
                            window.sessionStorage.removeItem(RECOVERY_KEY);
                        } catch (_error) {
                            // No action is required when session storage is unavailable.
                        }
                    }
                }, 15000);
            })();
        </script>
