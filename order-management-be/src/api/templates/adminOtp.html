<!doctype html>
<html lang="en">
    <body style="margin: 0; background: #f3f6f4; font-family: Arial, sans-serif; color: #172033">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="padding: 30px 12px">
            <tr>
                <td align="center">
                    <table
                        role="presentation"
                        width="100%"
                        cellspacing="0"
                        cellpadding="0"
                        style="
                            max-width: 560px;
                            background: #fff;
                            border: 1px solid #e1e8e4;
                            border-radius: 20px;
                            overflow: hidden;
                        "
                    >
                        <tr>
                            <td
                                style="
                                    padding: 28px;
                                    background: linear-gradient(135deg, #087d45, #0aad58);
                                    color: #fff;
                                "
                            >
                                <div style="font-size: 12px; font-weight: 800; letter-spacing: 2px">
                                    RC DINE SECURITY
                                </div>
                                <h1 style="margin: 8px 0 0; font-size: 26px">Admin verification code</h1>
                            </td>
                        </tr>
                        <tr>
                            <td style="padding: 30px">
                                <p style="margin: 0 0 10px">Hello {{name}},</p>
                                <p style="margin: 0 0 22px; line-height: 1.6; color: #5c6879">
                                    Use this code to complete {{purposeLabel}}. Never share it with anyone.
                                </p>
                                <div
                                    style="
                                        padding: 20px;
                                        border: 1px solid #cfe9d8;
                                        border-radius: 16px;
                                        background: #f1fcf5;
                                        text-align: center;
                                        font-size: 38px;
                                        font-weight: 900;
                                        letter-spacing: 10px;
                                        color: #087d45;
                                    "
                                >
                                    {{otp}}
                                </div>
                                <p style="margin: 20px 0 0; color: #667085; font-size: 13px">
                                    This code expires in {{expiryMinutes}} minutes and can be used only once.
                                </p>
                                <p style="margin: 18px 0 0; color: #8a3441; font-size: 12px">
                                    If you did not request this, change your RC DINE admin password immediately.
                                </p>
                            </td>
                        </tr>
                    </table>
                </td>
            </tr>
        </table>
    </body>
</html>
