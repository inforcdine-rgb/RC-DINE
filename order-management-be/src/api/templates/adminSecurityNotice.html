<!doctype html>
<html lang="en">
    <body style="margin: 0; background: #f3f6f4; font-family: Arial, sans-serif; color: #172033">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="padding: 30px 12px">
            <tr>
                <td align="center">
                    <table
                        role="presentation"
                        width="100%"
                        cellspacing="0"
                        cellpadding="0"
                        style="
                            max-width: 560px;
                            background: #fff;
                            border: 1px solid #e1e8e4;
                            border-radius: 20px;
                            overflow: hidden;
                        "
                    >
                        <tr>
                            <td style="padding: 26px; background: #172033; color: #fff">
                                <strong style="font-size: 21px">RC DINE security alert</strong>
                            </td>
                        </tr>
                        <tr>
                            <td style="padding: 30px">
                                <h2 style="margin: 0 0 12px; font-size: 20px">{{actionLabel}}</h2>
                                <p style="margin: 0; line-height: 1.6; color: #5c6879">{{detail}}</p>
                                <p style="margin: 20px 0 0; font-size: 12px; color: #7a8493">Time: {{timestamp}}</p>
                                <p style="margin: 16px 0 0; font-size: 12px; color: #8a3441">
                                    If this was not you, secure your email account and contact RC DINE support
                                    immediately.
                                </p>
                            </td>
                        </tr>
                    </table>
                </td>
            </tr>
        </table>
    </body>
</html>
